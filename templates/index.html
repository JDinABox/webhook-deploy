<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Webhook Deploy - Web Interface for managing deployments"
    />
    <title>Webhook Deploy</title>
    <link href="./assets/output.css" rel="stylesheet" />
  </head>

  <body class="flex min-w-full h-screen text-white bg-zinc-900">
    <div class="flex flex-col p-4 mx-auto max-w-5xl grow">
      <!-- Header -->
      <header class="flex justify-between items-center">
        <h1 class="text-2xl font-bold">Webhook Deploy</h1>

        {{ if ne .Username "" }}
        <div class="flex gap-4 items-center">
          <span class="text-zinc-400">
            Welcome, <span class="font-medium text-white">{{ .Username }}</span>
          </span>
          <button
            onclick="logout()"
            class="py-1.5 px-3 rounded-md transition-colors cursor-pointer hover:bg-red-700 active:bg-red-600 bg-red-900/80"
            aria-label="Logout"
          >
            Logout
          </button>
        </div>
        {{ end }}
      </header>

      <!-- Deployment Controls -->
      <section
        class="flex flex-col p-4 mt-6 rounded-lg border bg-zinc-800 border-zinc-700"
      >
        <h2 class="text-lg font-semibold">Deployment Controls</h2>
        <div class="flex flex-wrap gap-3 items-center mt-3">
          <select
            id="deploymentSelector"
            class="py-2 px-3 rounded-md border focus:border-transparent focus:ring-2 focus:ring-blue-500 focus:outline-none border-zinc-600 bg-zinc-900 min-w-[200px]"
            aria-label="Select deployment target"
          >
            {{ range $repoName, $deployment := .Deployments }}
            <option value="{{ $repoName }}">{{ $repoName }}</option>
            {{ end }}
          </select>
          <button
            id="deployBtn"
            onclick="runDeployment()"
            class="py-2 px-4 font-medium bg-blue-700 rounded-md transition-colors cursor-pointer hover:bg-blue-600 active:bg-blue-500 disabled:cursor-not-allowed disabled:bg-zinc-600"
            aria-label="Run selected deployment"
          >
            <span id="deployText">Run Selected Deployment</span>
          </button>
        </div>
      </section>

      <!-- Request Logs -->
      <section
        class="flex flex-col p-4 my-4 min-h-0 rounded-lg border grow bg-zinc-800 border-zinc-700"
      >
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-lg font-semibold">Request Logs</h2>
          <div class="flex gap-3 items-center">
            <label
              class="flex gap-2 items-center text-sm cursor-pointer text-zinc-400"
            >
              <input
                type="checkbox"
                id="autoRefresh"
                class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-zinc-600 bg-zinc-700 focus:ring-offset-zinc-800"
                onchange="toggleAutoRefresh()"
              />
              Auto-refresh
            </label>
            <button
              onclick="refreshLogs()"
              class="flex gap-1.5 items-center py-1.5 px-3 text-sm rounded-md transition-colors bg-zinc-700 hover:bg-zinc-600 active:bg-zinc-500"
              aria-label="Refresh logs"
              title="Refresh logs (Ctrl+R)"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 20 20"
                fill="currentColor"
                class="size-5"
              >
                <path
                  fill-rule="evenodd"
                  d="M15.312 11.424a5.5 5.5 0 0 1-9.201 2.466l-.312-.311h2.433a.75.75 0 0 0 0-1.5H3.989a.75.75 0 0 0-.75.75v4.242a.75.75 0 0 0 1.5 0v-2.43l.31.31a7 7 0 0 0 11.712-3.138.75.75 0 0 0-1.449-.39Zm1.23-3.723a.75.75 0 0 0 .219-.53V2.929a.75.75 0 0 0-1.5 0V5.36l-.31-.31A7 7 0 0 0 3.239 8.188a.75.75 0 1 0 1.448.389A5.5 5.5 0 0 1 13.89 6.11l.311.31h-2.432a.75.75 0 0 0 0 1.5h4.243a.75.75 0 0 0 .53-.219Z"
                  clip-rule="evenodd"
                />
              </svg>

              Refresh
            </button>
          </div>
        </div>

        <div
          id="logsContainer"
          class="overflow-auto p-3 font-mono text-sm rounded-md grow bg-zinc-950"
          role="log"
          aria-live="polite"
          aria-atomic="false"
        >
          {{ if .Logs }} {{ range .Logs }}
          <div
            class="py-1 px-2 rounded transition-colors log-entry hover:bg-zinc-800/50"
          >
            {{ . }}
          </div>
          {{ end }} {{ else }}
          <div
            class="flex flex-col justify-center items-center h-full text-zinc-500"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="mb-2 opacity-50 size-12"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"
              />
            </svg>
            <p>No logs available yet.</p>
            <p class="mt-1 text-xs">
              Logs will appear here when deployments are triggered.
            </p>
          </div>
          {{ end }}
        </div>
      </section>
    </div>

    <script>
      const LS_AR = "autoRefresh";
      const AUTO_REFRESH_TIME_INT = 2500;
      let autoRefreshInterval = null;
      function toggleAutoRefresh() {
        if (document.getElementById("autoRefresh").checked) {
          localStorage.setItem(LS_AR, "true");
          autoRefreshInterval = setInterval(refreshLogs, AUTO_REFRESH_TIME_INT);
          return;
        }
        localStorage.setItem(LS_AR, "false");
        clearInterval(autoRefreshInterval);
        autoRefreshInterval = null;
      }

      function refreshLogs() {
        location.reload();
      }

      async function runDeployment() {
        const selector = document.getElementById("deploymentSelector");
        const repoName = selector.value;
        if (!repoName) {
          alert("Please select a deployment target.");
          return;
        }

        if (confirm(`Are you sure you want to deploy ${repoName}?`)) {
          const btn = document.getElementById("deployBtn");
          const text = document.getElementById("deployText");

          btn.disabled = true;
          text.textContent = "Deploying...";

          try {
            console.log(`Attempting to deploy: ${repoName}`);
            const response = await fetch("/deploy", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({ repository: repoName }),
            });
            const text = await response.text();

            alert(text);
            location.reload();
          } catch (error) {
            alert("Deployment request failed: " + error.message);
            // Reset button state
            btn.disabled = false;
            text.textContent =
              "Run Selected Deployment";
          }
        }
      }

      async function logout() {
        const response = await fetch("/logout", {
          method: "POST",
        });
        if (response.ok) {
          alert("Logged out successfully.");
          location.reload();
        } else {
          alert("Logout failed.");
        }
      }

      function styleLogEntries() {
        document.querySelectorAll(".log-entry").forEach((entry) => {
          const text = entry.textContent.toLowerCase();
          if (text.includes("error") || text.includes("failed")) {
            entry.classList.add("text-red-400");
          } else if (text.includes("success") || text.includes("complete")) {
            entry.classList.add("text-green-400");
          } else if (text.includes("warning")) {
            entry.classList.add("text-yellow-400");
          } else if (text.includes("deploying")) {
            entry.classList.add("text-blue-400");
          }
        });
      }

      function scrollToBottom() {
        const container = document.getElementById("logsContainer");
        if (container) {
          container.scrollTop = container.scrollHeight;
        }
      }

      function autoRefreshPersist() {
        if ((localStorage.getItem(LS_AR) || "") == "true") {
          document.getElementById("autoRefresh").checked = true;
          autoRefreshInterval = setInterval(refreshLogs, AUTO_REFRESH_TIME_INT);
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        styleLogEntries();
        autoRefreshPersist();
        scrollToBottom();
      });
    </script>
  </body>
</html>
